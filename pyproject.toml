[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excense"
version = "0.1.0"
description = "Microsoft 365 Graph gateway: expose calendar, contacts and tasks as CalDAV/CardDAV for Android"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bcrypt>=4.1",
    "httpx>=0.27",
    "msal>=1.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "radicale>=3.8.0,<4",
    "vobject>=0.9.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
excense = "excense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]